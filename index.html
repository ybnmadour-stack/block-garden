<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b8e3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Block Garden</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sky.css">
</head>
<body>
  <main class="game">
    <header><span class="eyebrow">A LITTLE SPACE TO PLAY</span><h1>Block Garden<span>✦</span></h1><p>Find a fit. Make room. Keep growing.</p></header>
    <section class="scores" aria-label="Scores"><div><span>SCORE</span><strong id="score">0</strong></div><div><span>PERSONAL BEST</span><strong id="best">0</strong></div><button id="restart" aria-label="Start a new game">↻</button></section>
    <div class="mode-bar"><label for="mode">GAME MODE</label><select id="mode"><option value="classic">Classic · No timer</option><option value="timed">5-minute challenge</option></select><strong id="timer" hidden aria-label="Time remaining">5:00</strong></div>
    <p id="status" role="status">Pick a block, then tap the board — or drag it.</p>
    <div id="board" role="group" aria-label="8 by 8 game board"></div>
    <section id="tray" aria-label="Available blocks"></section>
    <footer>Fill a row or column to clear it.<br><span>No timer. Just one more piece.</span></footer>
    <dialog id="gameover"><span class="eyebrow">A LOVELY LITTLE RUN</span><h2>Garden full!</h2><p>You scored <strong id="final-score">0</strong> points.</p><button id="again">Grow again</button></dialog>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
